version: 1

project_name: 2fa

before:
  hooks:
    - go mod tidy

builds:
  - id: 2fa
    main: ./cmd/2fa
    binary: 2fa
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
      - -ldflags=-s -w

archives:
  - id: default
    format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{ .Version }}_
      {{ .Os }}_
      {{ .Arch }}
    files:
      - README.md
      - LICENSE
      - ARCHITECTURE.md
      - THREAT_MODEL.md

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"