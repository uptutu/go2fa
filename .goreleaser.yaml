# 2fa GoReleaser config (v2)
#
# Local-only build/publish pipeline. CI overrides may apply.
# Release artifacts pushed to GitHub: uptutu/go2fa via $GITHUB_TOKEN.
# Git tag is also pushed to 'origin' (gitlab) by default — see push_remote below.

version: 2

project_name: 2fa

before:
  hooks:
    - go mod tidy

builds:
  - id: 2fa
    main: ./cmd/2fa
    binary: 2fa
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - ARCHITECTURE.md
      - THREAT_MODEL.md

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

# goreleaser v2 does NOT auto-push tags.
# Push tag to origin (gitlab) AND uptutu (github) manually before running:
#   git tag v0.0.1 -m "..." && git push origin v0.0.1 && git push uptutu v0.0.1

release:
  github:
    owner: uptutu
    name: go2fa