<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>2fa — TOTP Vault</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.4 system-ui, sans-serif; margin: 0; padding: 0; }
  header { padding: 12px 16px; border-bottom: 1px solid #ccc3;
           display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 16px; margin: 0; }
  #status { font-size: 12px; color: #888; }
  main { padding: 16px; max-width: 900px; }
  ul#secrets { list-style: none; padding: 0; margin: 0; }
  ul#secrets li { padding: 8px 12px; border-bottom: 1px solid #ccc1;
                  display: grid; grid-template-columns: 1fr 130px 60px;
                  gap: 8px; align-items: center; }
  ul#secrets li:hover { background: #8881; }
  .issuer { font-weight: 600; }
  .account { font-size: 12px; color: #888; }
  .code { font-family: ui-monospace, Menlo, monospace; font-size: 18px;
          text-align: center; padding: 4px 8px; border: 1px solid #8884;
          border-radius: 6px; cursor: pointer; user-select: all; }
  .bar { height: 4px; background: linear-gradient(to right, #4ade80 var(--pct), #8883 0); }
  form#add { border: 1px solid #8884; padding: 12px; border-radius: 8px;
             margin: 12px 0; display: grid; gap: 6px; }
  form#add input, form#add select { padding: 4px 6px; font: inherit; }
  form#add button { padding: 6px 14px; font: inherit; }
  #qr { display: none; margin-top: 8px; }
  #qr.show { display: block; }
  video { width: 100%; max-width: 320px; }
</style>
</head>
<body>
<header>
  <h1>2fa</h1>
  <span id="status">loading…</span>
</header>
<main>
  <form id="add" onsubmit="return false">
    <input id="uri" placeholder="otpauth://totp/Issuer:Account?secret=…">
    <div style="display:flex;gap:8px;">
      <input id="manual-issuer" placeholder="issuer">
      <input id="manual-account" placeholder="account">
      <input id="manual-secret" placeholder="base32 secret">
    </div>
    <div style="display:flex;gap:8px;">
      <button type="button" id="add-uri-btn">Add via URI</button>
      <button type="button" id="add-manual-btn">Add manually</button>
      <button type="button" id="scan-btn">Scan QR</button>
    </div>
    <div id="qr"><video id="video" autoplay playsinline></video><canvas id="canvas" hidden></canvas></div>
  </form>
  <ul id="secrets"></ul>
</main>
<script src="app.js"></script>
<script src="jsqr.min.js"></script>
</body>
</html>
